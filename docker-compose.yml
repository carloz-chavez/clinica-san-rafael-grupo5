
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
      POSTGRES_DB: clinica_san_rafael
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datos_postgres_clinica:/var/lib/postgresql/data
      - ./db/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./db/02_permisos.sql:/docker-entrypoint-initdb.d/02_permisos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica_san_rafael"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos_postgres_clinica:
